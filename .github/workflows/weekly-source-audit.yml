name: Weekly official-source audit

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:audit
      - name: Open a review pull request when sources changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/source-state.json source-audit.md; then
            echo "No official-source changes detected."
            exit 0
          fi
          branch="automation/source-audit-$(date -u +%Y-%m-%d)"
          git config user.name "cardscout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/source-state.json source-audit.md
          git commit -m "audit official card sources"
          git push --force-with-lease origin "$branch"
          gh pr create --title "Weekly official-source audit" --body-file source-audit.md --base main --head "$branch" || true
